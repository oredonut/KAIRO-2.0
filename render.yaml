services:
  - type: web
    name: kairo-backend
    runtime: node
    region: oregon
    plan: free
    branch: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: kairo_production_jwt_secret_key_2026
